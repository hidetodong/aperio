[package]
name = "emerge"
version = "0.0.1"
description = "Aperio，自己 Mac 上的轻阅读器"
authors = []
edition = "2021"

[lib]
name = "emerge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Aperio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
